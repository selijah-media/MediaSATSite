name: Deploy site
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build inspiration list
        env:
          DRIVE_LIST_URL: ${{ secrets.DRIVE_LIST_URL }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
        run: python3 tools/make_manifest.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
